<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560">
<defs>
  <linearGradient id="brandv" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#C13CFF"/><stop offset=".5" stop-color="#1A3BFF"/><stop offset="1" stop-color="#2FD4FF"/>
  </linearGradient>
  <radialGradient id="glowCv"><stop offset="0" stop-color="#2FD4FF" stop-opacity=".55"/><stop offset="1" stop-color="#2FD4FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowMv"><stop offset="0" stop-color="#C13CFF" stop-opacity=".45"/><stop offset="1" stop-color="#C13CFF" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowBv"><stop offset="0" stop-color="#1A3BFF" stop-opacity=".6"/><stop offset="1" stop-color="#1A3BFF" stop-opacity="0"/></radialGradient>
  <pattern id="gridv" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity=".05" stroke-width="1"/>
  </pattern>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16206A" stop-opacity=".92"/><stop offset="1" stop-color="#0B1450" stop-opacity=".92"/></linearGradient>
  <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2FD4FF" stop-opacity=".45"/><stop offset="1" stop-color="#2FD4FF" stop-opacity="0"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<ellipse cx="380" cy="250" rx="300" ry="240" fill="url(#glowBv)"/>
<ellipse cx="520" cy="110" rx="170" ry="140" fill="url(#glowCv)"/>
<ellipse cx="140" cy="470" rx="190" ry="140" fill="url(#glowMv)"/>

<!-- code window -->
<g filter="url(#shadow)">
  <rect x="150" y="40" width="440" height="280" rx="18" fill="url(#card)" stroke="#FFFFFF" stroke-opacity=".12"/>
  <rect x="150" y="40" width="440" height="44" rx="18" fill="#FFFFFF" fill-opacity=".04"/>
  <circle cx="178" cy="62" r="6" fill="#C13CFF"/><circle cx="198" cy="62" r="6" fill="#8EA2FF"/><circle cx="218" cy="62" r="6" fill="#2FD4FF"/>
  <rect x="250" y="56" width="120" height="12" rx="6" fill="#FFFFFF" fill-opacity=".12"/>
  <rect x="198" y="108" width="78" height="8" rx="4" fill="#2FD4FF" opacity="0.35"/><rect x="216" y="130" width="74" height="8" rx="4" fill="#2FD4FF" opacity="0.8"/><rect x="180" y="152" width="39" height="8" rx="4" fill="#FFFFFF" opacity="0.55"/><rect x="180" y="174" width="39" height="8" rx="4" fill="#FFFFFF" opacity="0.35"/><rect x="216" y="196" width="56" height="8" rx="4" fill="#2FD4FF" opacity="0.8"/><rect x="216" y="218" width="34" height="8" rx="4" fill="#C13CFF" opacity="0.35"/><rect x="260" y="218" width="99" height="8" rx="4" fill="#C13CFF" opacity="0.55"/><rect x="198" y="240" width="97" height="8" rx="4" fill="#2FD4FF" opacity="0.8"/><rect x="198" y="262" width="51" height="8" rx="4" fill="#2FD4FF" opacity="0.8"/><rect x="259" y="262" width="101" height="8" rx="4" fill="#C13CFF" opacity="0.55"/><rect x="370" y="262" width="40" height="8" rx="4" fill="#2FD4FF" opacity="0.8"/><rect x="180" y="284" width="54" height="8" rx="4" fill="#FFFFFF" opacity="0.8"/><rect x="244" y="284" width="96" height="8" rx="4" fill="#FFFFFF" opacity="0.55"/><rect x="350" y="284" width="87" height="8" rx="4" fill="#FFFFFF" opacity="0.55"/>
</g>

<!-- chart card -->
<g filter="url(#shadow)">
  <rect x="40" y="250" width="300" height="200" rx="18" fill="url(#card)" stroke="#FFFFFF" stroke-opacity=".12"/>
  <rect x="64" y="274" width="90" height="10" rx="5" fill="#FFFFFF" fill-opacity=".5"/>
  <rect x="64" y="292" width="60" height="8" rx="4" fill="#FFFFFF" fill-opacity=".2"/>
  <path d="M64 420 C104 404 120 380 150 384 S200 340 230 344 S280 300 316 296 V430 H64Z" fill="url(#area)"/>
  <path d="M64 420 C104 404 120 380 150 384 S200 340 230 344 S280 300 316 296" fill="none" stroke="#2FD4FF" stroke-width="3"/>
  <circle cx="316" cy="296" r="6" fill="#2FD4FF"/><circle cx="316" cy="296" r="12" fill="#2FD4FF" opacity=".25"/>
</g>

<!-- Taipei / Hong Kong link card -->
<g filter="url(#shadow)">
  <rect x="370" y="300" width="230" height="200" rx="18" fill="url(#card)" stroke="#FFFFFF" stroke-opacity=".12"/>
  <path d="M420 450 Q485 320 550 380" fill="none" stroke="url(#brandv)" stroke-width="3" stroke-dasharray="6 7"/>
  <circle cx="550" cy="380" r="9" fill="#2FD4FF"/><circle cx="550" cy="380" r="18" fill="#2FD4FF" opacity=".2"/>
  <circle cx="420" cy="450" r="9" fill="#C13CFF"/><circle cx="420" cy="450" r="18" fill="#C13CFF" opacity=".2"/>
  <text x="566" y="366" font-family="Figtree, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="end">TPE</text>
  <text x="404" y="482" font-family="Figtree, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">HKG</text>
  <rect x="394" y="324" width="80" height="10" rx="5" fill="#FFFFFF" fill-opacity=".5"/>
</g>

<!-- brand parallelograms -->
<path d="M560 520 L590 470 H630 L600 520Z" fill="url(#brandv)" opacity=".9"/>
<path d="M20 120 L44 80 H76 L52 120Z" fill="url(#brandv)" opacity=".7"/>
</svg>
